<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="5;url=https://www.micunda.es">
  <title>miCunda — Nueva dirección</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      background: #1a4a8a;
      font-family: 'Oswald', sans-serif;
    }
    .card {
      background: #EDE8DF;
      border: 3px solid #B8A888;
      box-shadow: 6px 6px 0 rgba(0,0,0,.25);
      padding: 40px 36px 36px;
      text-align: center;
      max-width: 340px;
      width: 90%;
    }
    .card img {
      width: 80px; height: 80px;
      image-rendering: pixelated;
      margin-bottom: 18px;
    }
    .card h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px; letter-spacing: 4px;
      color: #1a4a8a; margin-bottom: 6px;
    }
    .card p {
      font-size: 15px; color: #444; line-height: 1.6;
      margin-bottom: 28px;
    }
    .card p strong { color: #1A1208; }
    .btn {
      display: inline-block;
      background: #D4520A;
      color: #fff;
      font-family: 'Oswald', sans-serif;
      font-size: 15px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      text-decoration: none;
      padding: 13px 32px;
      box-shadow: 4px 4px 0 #8B3000;
      transition: background .15s;
    }
    .btn:hover { background: #8B3000; }
    .countdown {
      margin-top: 18px;
      font-size: 12px; color: #999; letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://www.micunda.es/icons/icon_retro.png" alt="miCunda">
    <h1>miCunda</h1>
    <p>Esta app se ha mudado a una nueva dirección.<br>
    Visítanos en <strong>www.micunda.es</strong></p>
    <a class="btn" href="https://www.micunda.es">Ir a miCunda</a>
    <div class="countdown" id="cd">Redirigiendo en 5 segundos…</div>
  </div>
  <script>
    let s = 5;
    const el = document.getElementById('cd');
    const t = setInterval(() => {
      s--;
      if (s <= 0) { clearInterval(t); el.textContent = 'Redirigiendo…'; }
      else el.textContent = `Redirigiendo en ${s} segundo${s !== 1 ? 's' : ''}…`;
    }, 1000);
  </script>
</body>
</html>
